<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NM Calçados | Clientes</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/customers.css">
</head>
<body>
<main class="admin-shell customers-shell">
  <header class="admin-header">
    <div><p class="eyebrow">NM Calçados</p><h1>Clientes</h1><p class="muted">Cadastro, busca rápida e histórico comercial.</p></div>
    <a class="secondary-link" href="/">Voltar</a>
  </header>

  <section id="create-card" class="admin-card" hidden>
    <div class="section-heading"><div><h2>Novo cliente</h2><p class="muted">CPF/CNPJ é opcional, mas deve ser válido quando informado.</p></div></div>
    <form id="customer-form" class="customer-form">
      <label>Nome<input name="name" maxlength="180" required></label>
      <label>CPF/CNPJ<input name="document" maxlength="20" autocomplete="off"></label>
      <label>Telefone<input name="phone" maxlength="20" inputmode="tel"></label>
      <label>WhatsApp<input name="whatsapp" maxlength="20" inputmode="tel"></label>
      <label>E-mail<input name="email" type="email" maxlength="190"></label>
      <label>Nascimento<input name="birthDate" type="date"></label>
      <label>CEP<input name="postalCode" maxlength="10" inputmode="numeric"></label>
      <label class="span-2">Logradouro<input name="street" maxlength="180"></label>
      <label>Número<input name="streetNumber" maxlength="30"></label>
      <label>Complemento<input name="addressComplement" maxlength="100"></label>
      <label>Bairro<input name="neighborhood" maxlength="120"></label>
      <label>Cidade<input name="city" maxlength="120"></label>
      <label>UF<input name="state" maxlength="2"></label>
      <label class="span-all">Observações<textarea name="notes" rows="3" maxlength="5000"></textarea></label>
      <button class="primary-button" type="submit">Cadastrar cliente</button>
    </form>
  </section>

  <section class="admin-card">
    <div class="section-heading">
      <div><h2>Clientes cadastrados</h2><p id="customer-count" class="muted"></p></div>
      <button id="refresh-customers" class="secondary-button" type="button">Atualizar</button>
    </div>
    <form id="customer-filters" class="filter-bar customer-filters">
      <input name="q" placeholder="Nome, CPF/CNPJ, telefone, WhatsApp ou e-mail">
      <select name="isActive"><option value="">Todos</option><option value="true">Ativos</option><option value="false">Inativos</option></select>
      <button class="secondary-button" type="submit">Buscar</button>
    </form>
    <div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Documento</th><th>Contato</th><th>Cidade</th><th>Status</th><th>Ações</th></tr></thead><tbody id="customers-body"></tbody></table></div>
    <div class="pagination"><button id="prev-page" class="secondary-button" type="button">Anterior</button><span id="page-info" class="muted"></span><button id="next-page" class="secondary-button" type="button">Próxima</button></div>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </section>
</main>

<dialog id="customer-dialog" class="wide-dialog customer-dialog">
  <form id="customer-edit-form" class="customer-form" method="dialog">
    <div class="span-all section-heading"><div><h2>Ficha do cliente</h2><p id="customer-meta" class="muted"></p></div><button id="close-customer" type="button" class="secondary-button">Fechar</button></div>
    <input name="id" type="hidden">
    <label>Nome<input name="name" maxlength="180" required></label>
    <label>CPF/CNPJ<input name="document" maxlength="20"></label>
    <label>Telefone<input name="phone" maxlength="20"></label>
    <label>WhatsApp<input name="whatsapp" maxlength="20"></label>
    <label>E-mail<input name="email" type="email" maxlength="190"></label>
    <label>Nascimento<input name="birthDate" type="date"></label>
    <label>CEP<input name="postalCode" maxlength="10"></label>
    <label class="span-2">Logradouro<input name="street" maxlength="180"></label>
    <label>Número<input name="streetNumber" maxlength="30"></label>
    <label>Complemento<input name="addressComplement" maxlength="100"></label>
    <label>Bairro<input name="neighborhood" maxlength="120"></label>
    <label>Cidade<input name="city" maxlength="120"></label>
    <label>UF<input name="state" maxlength="2"></label>
    <label>Status<select name="isActive"><option value="true">Ativo</option><option value="false">Inativo</option></select></label>
    <label class="span-all">Observações<textarea name="notes" rows="3" maxlength="5000"></textarea></label>
    <div id="commercial-summary" class="commercial-summary span-all"></div>
    <section class="history-grid span-all">
      <div><h3>Vendas recentes</h3><div id="recent-sales" class="history-list"></div></div>
      <div><h3>Contas a receber abertas</h3><div id="open-receivables" class="history-list"></div></div>
    </section>
    <div class="dialog-actions span-all"><button id="save-customer" class="primary-button" type="submit">Salvar alterações</button></div>
  </form>
</dialog>

<script src="/js/customers.js" defer></script>
</body>
</html>
