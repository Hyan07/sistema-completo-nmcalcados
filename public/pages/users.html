<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NM Calçados | Usuários</title><link rel="stylesheet" href="/css/main.css"></head>
<body>
<main class="admin-shell">
<header class="admin-header"><div><p class="eyebrow">NM Calçados</p><h1>Usuários e perfis</h1></div><a class="secondary-link" href="/">Voltar</a></header>
<section id="create-card" class="admin-card" hidden><h2>Novo usuário</h2><form id="create-user-form" class="grid-form">
<label>Nome<input name="name" maxlength="150" required></label><label>Usuário<input name="username" maxlength="80" required></label><label>E-mail<input name="email" type="email" maxlength="190"></label><label>Perfil<select name="roleId" required></select></label><label>Senha<input name="password" type="password" minlength="12" maxlength="128" required></label><button class="primary-button" type="submit">Cadastrar usuário</button>
</form></section>
<section class="admin-card"><div class="section-heading"><div><h2>Usuários cadastrados</h2><p class="muted">Alterações de perfil e status invalidam sessões antigas automaticamente.</p></div><button id="refresh-button" class="secondary-button" type="button">Atualizar</button></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Usuário</th><th>Perfil</th><th>Status</th><th>Ações</th></tr></thead><tbody id="users-body"></tbody></table></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p></section>
</main>
<dialog id="password-dialog" class="password-dialog"><form id="password-reset-form" method="dialog"><h2>Redefinir senha</h2><p class="muted">A alteração encerrará as sessões antigas desse usuário.</p><label>Nova senha<input id="reset-password" type="password" minlength="12" maxlength="128" required></label><div class="dialog-actions"><button id="cancel-reset" class="secondary-button" type="button">Cancelar</button><button class="primary-button" type="submit">Redefinir</button></div></form></dialog>
<script src="/js/users.js" defer></script></body></html>
