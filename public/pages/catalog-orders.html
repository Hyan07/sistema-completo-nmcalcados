<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NM Calçados | Pedidos do catálogo</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/catalog-orders.css"></head><body>
<main class="admin-shell orders-shell"><header class="admin-header"><div><p class="eyebrow">NM Calçados</p><h1>Pedidos do catálogo</h1><p class="muted">Atendimento, reserva e conversão em venda.</p></div><div class="header-actions"><a class="secondary-link" href="/catalog/">Abrir catálogo</a><a class="secondary-link" href="/">Voltar</a></div></header>
<section class="admin-card"><form id="filters" class="order-filters"><label>Pesquisar<input name="q" placeholder="Pedido, cliente ou telefone"></label><label>Status<select name="status"><option value="">Todos</option><option>NEW</option><option>WAITING_SERVICE</option><option>NEGOTIATING</option><option>CONFIRMED</option><option>EXPIRED</option><option>CONVERTED</option><option>CANCELLED</option></select></label><button class="primary-button">Buscar</button></form><p id="feedback" class="feedback"></p></section>
<section class="admin-card"><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Contato</th><th>Status</th><th>Itens</th><th>Total</th><th>Responsável</th><th>Atualização</th></tr></thead><tbody id="orders-body"></tbody></table></div><div class="pager"><button id="prev" class="secondary-button">Anterior</button><span id="page-label"></span><button id="next" class="secondary-button">Próxima</button></div></section>
</main>
<dialog id="order-dialog" class="order-dialog"><button id="close" class="dialog-close" type="button">×</button><div id="order-detail"></div></dialog>
<script src="/js/catalog-orders.js" defer></script></body></html>
